[project]
name = "prompter"
version = "0.1.9"
description = "Batch prompt runner for Claude CLI"
authors = [
    {name = "Alex Nourov",email = "nourov@specialist-it.com.ua"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
]

[project.scripts]
prompter = "prompter.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "prompter", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
