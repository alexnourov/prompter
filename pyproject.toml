[project]
name = "prompter"
version = "0.1.11"
description = "CLI utility for automating Claude CLI interactions"
authors = [
    {name = "Alex Nourov",email = "nourov@specialist-it.com.ua"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "charset-normalizer (>=3.4.4,<4.0.0)",
]

[project.scripts]
prompter = "prompter.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "prompter", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
